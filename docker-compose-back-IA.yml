name: DevFestToulouse2025-back-IA

services:

  fulcrum:
    build:
      context: .
      dockerfile: fulcrum/Dockerfile
    ports:
      - "${API_PORT}:8086"
    environment:
      - REDIS_ADDRESS=redis:6379
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - local_net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - local_net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

networks:
  local_net:
    driver: bridge

volumes:
  redis-data:
    driver: local
  ollama_data:
